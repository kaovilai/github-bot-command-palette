<!DOCTYPE html>
<!--
  Minimal stand-in for GitHub's logged-in PR page, used by
  tests/overridden-check-retest.spec.js. Reproduces the DOM the scraper
  targets for two checks:
    - an /override'd job: renders GREEN (Prow's override plugin rewrites the
      context to success) with "Overridden by kaovilai" in the description —
      exactly the row that used to be mistaken for a genuine pass.
    - a genuinely passing job, which must stay untouched.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fixture: PR with overridden check</title>
</head>
<body>
  <main class="container-xl">
    <section aria-label="Checks">
      <ul class="list-style-none">
        <li aria-label="ci/prow/5.0-e2e-test-aws">
          <div class="d-flex flex-items-center">
            <svg class="octicon octicon-check color-fg-success" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"></svg>
            <h4 class="f5">
              <a href="https://prow.ci.openshift.org/view/gs/test-platform-results-public/pr-logs/pull/openshift_oadp-operator/2493/pull-ci-openshift-oadp-operator-oadp-dev-5.0-e2e-test-aws/2118058375735414000"><span>ci/prow/5.0-e2e-test-aws</span></a>
            </h4>
            <span class="StatusCheckRow-module__titleDescription__uQ3cm"><span></span> — Job succeeded.</span>
          </div>
        </li>
        <li aria-label="ci/prow/5.0-virt-kdm-e2e-test-aws Overridden by kaovilai">
          <div class="d-flex flex-items-center">
            <svg class="octicon octicon-check color-fg-success" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"></svg>
            <h4 class="f5">
              <a href="https://prow.ci.openshift.org/view/gs/test-platform-results-public/pr-logs/pull/openshift_oadp-operator/2493/pull-ci-openshift-oadp-operator-oadp-dev-5.0-virt-kdm-e2e-test-aws/2118058375735414784"><span>ci/prow/5.0-virt-kdm-e2e-test-aws</span></a>
            </h4>
            <span class="StatusCheckRow-module__titleDescription__uQ3cm"><span></span> — Overridden by kaovilai</span>
          </div>
        </li>
      </ul>
    </section>
    <div class="js-discussion" id="discussion_bucket">
      <form class="js-new-comment-form">
        <textarea id="new_comment_field" name="comment[body]"></textarea>
      </form>
    </div>
  </main>
</body>
</html>
