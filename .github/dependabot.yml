version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # *.lock.yml workflow files are GENERATED by `gh-aw compile` from the
      # *.md sources. Dependabot bumps the gh-aw-actions/setup SHA inside
      # them, but that pin is owned by the gh-aw compiler — every recompile
      # rewrites it, so the bump can never stick and only creates lock drift
      # that this repo's check-lock-files job has to mop up (see #209).
      # Updates flow through gh-aw upgrades instead. setup-cli (and any
      # hand-written workflow action) is NOT ignored.
      - dependency-name: "github/gh-aw-actions/setup"
