name: Release

# Publishes/repairs a GitHub Release whenever manifest.json or updates.xml
# lands on main.
#
# Assets: versioned ZIP + CRX, plus stable-name copies (`…/latest/download/`)
# that updates.xml points at. The signed CRX is what makes self-hosted
# auto-updates work: chromium-web-store (or Chrome's external-extension
# updater) installs it once the advertised version beats the installed one.
#
# This job is also the repair path: if a release went out while
# EXTENSION_PRIVATE_KEY was unavailable, a later run attaches the missing CRX
# to that existing release instead of doing nothing (updates.xml would
# otherwise advertise a 404 forever).
on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - updates.xml

permissions:
  contents: write

# Two pushes close together must not race on release creation.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Verify update manifest matches manifest.json
        run: |
          # A drift here ships silently-broken updates: clients fetch
          # updates.xml, see an appid that does not match their extension, or a
          # version that is not newer, and quietly do nothing.
          node --test tests/update-manifest.test.js

      - name: Publish or repair the release
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v${VERSION}"

          # Exit codes: 0 = CRX ready, 1 = secret absent (publish ZIP-only),
          # 2 = packaging failed (abort — never publish a half-built release).
          # Every step needs its own `|| return 2`: this function is invoked
          # from an `if`, which suspends `set -e` for its whole body.
          build_crx() {
            if [ -z "${EXTENSION_PRIVATE_KEY:-}" ]; then
              echo "::warning::EXTENSION_PRIVATE_KEY secret is not set — publishing without a CRX. users will NOT receive auto-updates."
              return 1
            fi
            printf '%s\n' "$EXTENSION_PRIVATE_KEY" > "$RUNNER_TEMP/extension-key.pem" || return 2
            chmod 600 "$RUNNER_TEMP/extension-key.pem" || return 2
            # Rejects a key whose derived ID disagrees with updates.xml.
            ./scripts/package-crx.sh "$RUNNER_TEMP/extension-key.pem" || return 2
            # Stable URL updates.xml advertises; must be the newest build.
            cp "github-bot-command-palette-v${VERSION}.crx" github-bot-command-palette.crx || return 2
            return 0
          }

          # Repair path comes FIRST, before the latest-version guard: a ZIP-only
          # release stays repairable even after main has moved on to a newer
          # version (otherwise it would remain CRX-less forever). Build from the
          # tagged commit — not from main — so the repaired CRX matches the ZIP
          # already published for this version instead of shipping different code.
          if gh release view "$TAG" >/dev/null 2>&1; then
            HAVE_CRX=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | index("github-bot-command-palette.crx") != null')
            if [ "$HAVE_CRX" = "true" ]; then
              echo "${TAG} already released with a CRX; nothing to do"
              exit 0
            fi
            echo "${TAG} exists but has no CRX — attaching it now"
            # actions/checkout fetches one commit and no tags, so the tag must
            # be fetched explicitly or this checkout fails before packaging.
            git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git checkout --force --detach "$TAG"
            RC=0
            build_crx || RC=$?
            if [ "$RC" -eq 2 ]; then
              echo "::error::CRX packaging failed; refusing to leave a ZIP-only release advertising a CRX"
              exit 1
            elif [ "$RC" -eq 0 ]; then
              gh release upload "$TAG" \
                "github-bot-command-palette-v${VERSION}.crx" github-bot-command-palette.crx --clobber
            fi
            exit 0
          fi

          # Nothing to repair. Never let an older version take over
          # `releases/latest`. A failed lookup must NOT be read as "no release
          # exists" — that would skip the guard and let an older version publish
          # as latest.
          RC=0
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>"$RUNNER_TEMP/latest.err") || RC=$?
          if [ "$RC" -ne 0 ]; then
            if grep -qi "not found" "$RUNNER_TEMP/latest.err"; then
              LATEST=""
            else
              echo "::error::could not determine the latest release; refusing to publish"
              cat "$RUNNER_TEMP/latest.err"
              exit 1
            fi
          fi
          if [ -n "$LATEST" ]; then
            # Exit codes from the comparison: 0 = latest is newer (refuse),
            # 1 = this version is newer or equal (publish), anything else =
            # comparison itself failed -> abort rather than guess.
            RC=0
            node -e '
              const parse = v => v.replace(/^v/, "").split(".").map(n => parseInt(n, 10) || 0);
              try {
                const [version, latest] = process.argv.slice(1).map(parse);
                for (let i = 0; i < Math.max(version.length, latest.length); i++) {
                  const d = (latest[i] || 0) - (version[i] || 0);
                  if (d !== 0) process.exit(d > 0 ? 0 : 1);
                }
                process.exit(1);
              } catch (e) {
                console.error(String(e));
                process.exit(2);
              }
            ' "$VERSION" "$LATEST" || RC=$?
            case "$RC" in
              0)
                echo "v${VERSION} is older than latest release ${LATEST}; refusing to publish it as latest"
                exit 0
                ;;
              1)
                ;;
              *)
                echo "::error::version comparison failed (exit ${RC}); refusing to publish"
                exit 1
                ;;
            esac
          fi

          ./scripts/package-extension.sh
          # Unversioned copy so /releases/latest/download/github-bot-command-palette.zip
          # is a stable URL for scripted updaters (e.g. Tasker on Android).
          cp "github-bot-command-palette-v${VERSION}.zip" github-bot-command-palette.zip

          ASSETS=("github-bot-command-palette-v${VERSION}.zip" github-bot-command-palette.zip)

          RC=0
          build_crx || RC=$?
          if [ "$RC" -eq 2 ]; then
            echo "::error::CRX packaging failed; refusing to publish a ZIP-only release while updates.xml advertises a CRX"
            exit 1
          elif [ "$RC" -eq 0 ]; then
            ASSETS+=("github-bot-command-palette-v${VERSION}.crx" github-bot-command-palette.crx)
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" --generate-notes --title "$TAG"
