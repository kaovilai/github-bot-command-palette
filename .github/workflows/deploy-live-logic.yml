name: Deploy live logic

# Publishes live/ (logic.json + its index page) to GitHub Pages so opt-in
# extensions can consume data-only logic updates without a release.
#
# Prerequisite (repo settings): Pages -> Source = "GitHub Actions", and the
# site is served under the parent Pages domain. With github.tig.pw configured
# as the CNAME for kaovilai.github.io, this project's artifact is reachable at
#   https://github.tig.pw/github-bot-command-palette/logic.json
# (project pages are served under /<repo-name>/ even when the domain is set on
# the user site).

on:
  push:
    branches:
      - main
    paths:
      - "live/**"
      - ".github/workflows/deploy-live-logic.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version-bump guard below compares against the previous commit.
          fetch-depth: 2
          persist-credentials: false

      - name: Validate logic.json
        run: |
          node -e '
            const fs = require("fs");
            const logic = JSON.parse(fs.readFileSync("live/logic.json", "utf8"));
            if (!Number.isFinite(logic.version)) throw new Error("logic.json: finite numeric version required");
            const pats = logic.errorLinePatterns || [];
            if (!Array.isArray(pats)) throw new Error("logic.json: errorLinePatterns must be an array");
            for (const p of pats) new RegExp(p); // compile check
            console.log("logic.json OK (version " + logic.version + ", " + pats.length + " patterns)");
          '

      - name: Require a version bump when logic changes
        if: github.event_name == 'push'
        env:
          BASELINE: ${{ github.event.before }}
        run: |
          # The extension only applies a live document when `version` changes,
          # so pattern/selector edits without a bump would silently never ship.
          # Compare against the pre-push tip (github.event.before), not HEAD^:
          # on a multi-commit push HEAD^ is just the previous commit of the
          # same push, which can already contain the unversioned change.
          if [ -z "$BASELINE" ] || [ "$BASELINE" = "0000000000000000000000000000000000000000" ]; then
            echo "No baseline commit (branch creation) — skipping bump check"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASELINE"; then
            echo "Could not fetch baseline commit $BASELINE — refusing to deploy without a comparison"
            exit 1
          fi
          prev=$(git show "$BASELINE:live/logic.json" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No live/logic.json at baseline (first deploy) — skipping bump check"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const prev = JSON.parse(process.argv[1]);
            const next = JSON.parse(fs.readFileSync("live/logic.json", "utf8"));
            const norm = o => JSON.stringify({
              checksSectionSelector: o.checksSectionSelector,
              legacyCheckRowSelector: o.legacyCheckRowSelector,
              errorLinePatterns: o.errorLinePatterns,
              maxErrorLines: o.maxErrorLines
            });
            if (norm(prev) !== norm(next) && prev.version === next.version) {
              console.error("live/logic.json logic changed without a version bump — the extension would never apply it. Bump `version`.");
              process.exit(1);
            }
            console.log("version-bump check OK (version " + next.version + ")");
          ' "$prev"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp live/logic.json live/index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
